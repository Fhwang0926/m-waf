{{define "settings.html"}}
<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>M-WAF 시스템 설정</title><link rel="stylesheet" href="/static/app.css"></head>
<body>{{template "navigation" .}}
<main class="container narrow"><div class="page-head"><div><p class="eyebrow">SYSTEM SETTINGS</p><h1>로그 보존 설정</h1></div></div>
{{if .Notice}}<div class="alert">{{.Notice}}</div>{{end}}
<section class="panel"><p class="muted">설정 기간보다 오래된 기록은 {{.CleanupInterval}} 간격의 백그라운드 정리 작업에서 순차 삭제됩니다.</p>
  <form method="post" action="/settings"><input type="hidden" name="csrf" value="{{.CSRF}}">
    <label>WAF 이벤트 보존 기간(일)<input type="number" name="event_retention_days" min="1" max="3650" value="{{.Settings.EventDays}}" required><small>기본값 30일 · 허용 범위 1~3650일</small></label>
    <label>관리자 감사 로그 보존 기간(일)<input type="number" name="audit_retention_days" min="30" max="3650" value="{{.Settings.AuditDays}}" required><small>기본값 365일 · 보안 감사 보호를 위해 최소 30일</small></label>
    <button type="submit">보존 설정 저장</button>
  </form>
</section></main></body></html>
{{end}}
