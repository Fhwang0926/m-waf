{{define "user-edit.html"}}
<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>M-WAF 사용자 수정</title><link rel="stylesheet" href="/static/app.css"></head>
<body>{{template "navigation" .}}<main class="container narrow"><div class="page-head"><div><p class="eyebrow">ACCESS CONTROL</p><h1>사용자 수정</h1></div><a class="button secondary" href="/users">목록으로</a></div>
<section class="panel"><p class="muted">{{.User.Username}} · {{.User.EnterpriseName}}</p><form method="post" action="/users/{{.User.ID}}"><input type="hidden" name="csrf" value="{{.CSRF}}"><label>표시 이름<input name="display_name" maxlength="255" value="{{.User.DisplayName}}" required></label>
{{if .IsSystemAdmin}}<label>권한<select name="role" required><option value="enterprise_user" {{if eq .User.Role "enterprise_user"}}selected{{end}}>기업 사용자</option><option value="enterprise_admin" {{if eq .User.Role "enterprise_admin"}}selected{{end}}>기업 관리자</option></select></label>{{end}}
<label class="check-row"><input type="checkbox" name="active" {{if .User.Active}}checked{{end}}> 로그인 활성화</label><label>새 비밀번호<input type="password" name="password" minlength="12" maxlength="256" autocomplete="new-password"><small>변경하지 않으려면 비워두세요.</small></label><label>새 비밀번호 확인<input type="password" name="password_confirm" minlength="12" maxlength="256" autocomplete="new-password"></label><button type="submit">사용자 저장</button></form></section>
<section class="panel danger-zone"><h2>사용자 삭제</h2><p class="muted">감사 이력은 보존하고 계정은 즉시 로그인할 수 없도록 삭제 처리합니다.</p><form method="post" action="/users/{{.User.ID}}/delete"><input type="hidden" name="csrf" value="{{.CSRF}}"><label class="check-row"><input type="checkbox" name="confirm" value="confirmed" required> 삭제 내용을 확인했습니다.</label><button class="danger" type="submit">사용자 삭제</button></form></section>
</main></body></html>
{{end}}
