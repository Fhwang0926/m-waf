{{define "login.html"}}
<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>M-WAF 로그인</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body class="login-page">
  <main class="login-card">
    <p class="eyebrow">M-WAF MANAGER</p>
    <h1>관리자 로그인</h1>
    <p class="muted">정책, 보호 서버와 WAF 이벤트를 중앙에서 관리합니다.</p>
    {{if .PasswordChanged}}<div class="alert">비밀번호가 변경되었습니다. 새 비밀번호로 로그인하세요.</div>{{end}}
    {{if .Error}}<div class="alert error">{{.Error}}</div>{{end}}
    <form method="post" action="/login">
      <label>사용자명<input name="username" autocomplete="username" required></label>
      <label>비밀번호<input type="password" name="password" autocomplete="current-password" required></label>
      <button type="submit">로그인</button>
    </form>
  </main>
</body>
</html>
{{end}}
