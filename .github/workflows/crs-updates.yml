name: Discover OWASP CRS updates

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: mwaf-crs-channel-updates
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out development branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: dev
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Update verified LTS and Stable CRS locks
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          go run ./cmd/mwaf-crs-updater -channel lts -write
          go run ./cmd/mwaf-crs-updater -channel stable -write

      - name: Open or refresh the CRS update pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          if git diff --quiet -- packaging/sources.lock.yaml; then
            echo "No CRS update is available"
            exit 0
          fi
          lts_version="$(go run ./cmd/mwaf-crs-updater -channel lts -field version)"
          stable_version="$(go run ./cmd/mwaf-crs-updater -channel stable -field version)"
          branch="codex/crs-auto-update"
          title="chore: prepare OWASP CRS LTS ${lts_version} and Stable ${stable_version}"
          body="Automated signed annotated-tag discovery for the pinned LTS line and the latest Stable CRS. The normal compatibility checks and approval flow remain required before release."
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add packaging/sources.lock.yaml
          git commit -m "$title"
          git push --force-with-lease origin "HEAD:refs/heads/${branch}"
          if gh pr view "$branch" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh pr edit "$branch" --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base dev --head "$branch" --title "$title" --body "$body"
          fi
