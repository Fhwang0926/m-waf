{{define "setup.html"}}
<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>M-WAF 최초 설정</title><link rel="stylesheet" href="/static/app.css"></head>
<body class="login-page">
  <main class="login-card setup-card">
    <p class="eyebrow">FIRST-TIME SETUP</p>
    <h1>시스템 관리자 설정</h1>
    <p class="muted">최초 한 번만 생성할 수 있습니다. 이 계정은 모든 기업과 보호 서버를 관리합니다.</p>
    {{if .Error}}<div class="alert error">{{.Error}}</div>{{end}}
    <form method="post" action="/setup">
      <input type="hidden" name="csrf" value="{{.CSRF}}">
      <label>사용자명<input name="username" minlength="3" maxlength="128" pattern="[A-Za-z0-9._-]+" autocomplete="username" value="{{.Username}}" required></label>
      <label>표시 이름<input name="display_name" maxlength="255" autocomplete="name" value="{{.DisplayName}}" required></label>
      <label>비밀번호<input type="password" name="password" minlength="12" maxlength="256" autocomplete="new-password" required></label>
      <label>비밀번호 확인<input type="password" name="password_confirm" minlength="12" maxlength="256" autocomplete="new-password" required></label>
      <button type="submit">시스템 관리자 생성</button>
    </form>
  </main>
</body>
</html>
{{end}}
