name: Verify changes and publish tagged Manager release

on:
  pull_request:
    paths:
      - ".github/workflows/dev-manager-image.yml"
      - "build/**"
      - "cmd/**"
      - "deploy/**"
      - "go.mod"
      - "go.sum"
      - "internal/**"
      - "migrations/**"
      - "packaging/**"
      - "web/**"
  push:
    branches: [dev]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mwaf-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TEST_UBUNTU_IMAGE: docker.io/library/ubuntu:24.04@sha256:561618e2c15bf2397621dd04f96926663a3b5616c189cf7e38db7e82f5c538ea

jobs:
  verify:
    name: Build and install-test packages
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: true

      - name: Install distro build inputs
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y apache2 libapache2-mod-security2 nginx libnginx-mod-http-modsecurity jq

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -eu
          printf '%s\n' "$RELEASE_TAG" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'

      - name: Verify source and deployment files
        run: |
          set -eu
          go test ./...
          go vet ./...
          sh -n internal/manager/bootstrap-install.sh
          sh -n packaging/agent/deb/build.sh
          sh -n packaging/module/deb/build.sh
          sh -n deploy/compose/prepare.sh
          grep -F 'agent_file="$tmp_dir/mwaf-agent.deb"' internal/manager/bootstrap-install.sh
          grep -F 'module_file="$tmp_dir/mwaf-module.deb"' internal/manager/bootstrap-install.sh
          docker compose --env-file deploy/compose/.env.example -f deploy/compose/compose.yaml config --quiet

      - name: Build Agent and module packages
        env:
          COMMIT: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -eu
          case "$GITHUB_REF" in
            refs/tags/v*) package_version=${GITHUB_REF_NAME#v} ;;
            *) package_version="0.1.0~ci.${RUN_NUMBER}" ;;
          esac
          mkdir -p dist/packages dist/metadata dist/empty
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w -X github.com/Fhwang0926/m-waf/internal/version.Version=${package_version} -X github.com/Fhwang0926/m-waf/internal/version.Commit=${COMMIT}" -o dist/mwaf-agent ./cmd/mwaf-agent
          VERSION="$package_version" COMMIT="$COMMIT" AGENT_BINARY=dist/mwaf-agent OUTPUT_DIR=dist/packages METADATA_DIR=dist/metadata packaging/agent/deb/build.sh
          curl -fL https://github.com/coreruleset/coreruleset/archive/refs/tags/v4.28.0.tar.gz -o dist/coreruleset.tar.gz
          echo "d8acc96f25ad07c8e3a595a23c797324f6d77e59ddf9e26e90dd95ebd2e676ce  dist/coreruleset.tar.gz" | sha256sum --check
          apache_version=$(apachectl -v 2>&1 | sed -n 's#.*Apache/\([^ ]*\).*#\1#p' | head -n 1)
          apache_hash=$(apachectl -V 2>&1 | sed '/^AH[0-9][0-9]*:/d; /^[[:space:]]*$/d; s/^[[:space:]]*//; s/[[:space:]]*$//' | sha256sum | awk '{print $1}')
          WEBSERVER=apache VERSION="$package_version" WEB_VERSION="$apache_version" WEB_BUILD_HASH="$apache_hash" OUTPUT_DIR=dist/packages METADATA_DIR=dist/metadata CRS_ARCHIVE=dist/coreruleset.tar.gz packaging/module/deb/build.sh
          nginx_version=$(nginx -v 2>&1 | sed -n 's#.*nginx/##p')
          nginx_hash=$(nginx -V 2>&1 | sed '/^AH[0-9][0-9]*:/d; /^[[:space:]]*$/d; s/^[[:space:]]*//; s/[[:space:]]*$//' | sha256sum | awk '{print $1}')
          WEBSERVER=nginx VERSION="$package_version" WEB_VERSION="$nginx_version" WEB_BUILD_HASH="$nginx_hash" OUTPUT_DIR=dist/packages METADATA_DIR=dist/metadata CRS_ARCHIVE=dist/coreruleset.tar.gz packaging/module/deb/build.sh
          test "$(find dist/packages -maxdepth 1 -type f -name '*.deb' | wc -l)" -eq 3
          for package in dist/packages/*.deb; do
            dpkg-deb --info "$package"
          done

      - name: Install Agent and Apache module on clean Ubuntu
        run: |
          set -eu
          docker run --rm --platform linux/amd64 \
            -v "$PWD/dist:/dist:ro" \
            "$TEST_UBUNTU_IMAGE" sh -euxc '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install --no-install-recommends -y apache2 jq
              apt-get install --no-install-recommends -y /dist/packages/mwaf-agent_*.deb /dist/packages/mwaf-modsecurity-apache_*.deb
              dpkg-query -W mwaf-agent mwaf-modsecurity-apache
              /usr/bin/mwaf-agent -version
              actual_version=$(apachectl -v 2>&1 | sed -n "s#.*Apache/\([^ ]*\).*#\1#p" | head -n 1)
              actual_hash=$(apachectl -V 2>&1 | sed "/^AH[0-9][0-9]*:/d; /^[[:space:]]*$/d; s/^[[:space:]]*//; s/[[:space:]]*$//" | sha256sum | awk "{print \$1}")
              test "$actual_version" = "$(jq -r .web_server_version /dist/metadata/module-apache.json)"
              test "$actual_hash" = "$(jq -r .web_server_build_hash /dist/metadata/module-apache.json)"
              apachectl configtest
              apachectl -M 2>&1 | grep -q security2_module
              grep -qx "4.28.0" /etc/mwaf/crs.version
              grep -q "copytruncate" /etc/logrotate.d/mwaf-modsecurity
              test "$(find /usr/share/mwaf/crs/rules -type f -name "*.conf" | wc -l)" -ge 20
              test "$(stat -c "%a:%U:%G" /var/log/modsecurity/audit.jsonl)" = "660:root:www-data"
            '

      - name: Install Agent and Nginx module on clean Ubuntu
        run: |
          set -eu
          docker run --rm --platform linux/amd64 \
            -v "$PWD/dist:/dist:ro" \
            "$TEST_UBUNTU_IMAGE" sh -euxc '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install --no-install-recommends -y nginx jq
              apt-get install --no-install-recommends -y /dist/packages/mwaf-agent_*.deb /dist/packages/mwaf-modsecurity-nginx_*.deb
              dpkg-query -W mwaf-agent mwaf-modsecurity-nginx
              /usr/bin/mwaf-agent -version
              actual_version=$(nginx -v 2>&1 | sed -n "s#.*nginx/##p")
              actual_hash=$(nginx -V 2>&1 | sed "/^AH[0-9][0-9]*:/d; /^[[:space:]]*$/d; s/^[[:space:]]*//; s/[[:space:]]*$//" | sha256sum | awk "{print \$1}")
              test "$actual_version" = "$(jq -r .web_server_version /dist/metadata/module-nginx.json)"
              test "$actual_hash" = "$(jq -r .web_server_build_hash /dist/metadata/module-nginx.json)"
              nginx -t
              nginx -T 2>&1 | grep -q "modsecurity on;"
              grep -qx "4.28.0" /etc/mwaf/crs.version
              grep -q "copytruncate" /etc/logrotate.d/mwaf-modsecurity
              test "$(find /usr/share/mwaf/crs/rules -type f -name "*.conf" | wc -l)" -ge 20
              test "$(stat -c "%a:%U:%G" /var/log/modsecurity/audit.jsonl)" = "660:root:www-data"
            '

      - name: Sign verification bundle
        env:
          COMMIT: ${{ github.sha }}
        run: |
          set -eu
          openssl genpkey -algorithm ED25519 -out dist/test-bundle-signing.key
          go run ./cmd/mwaf-bundle -metadata dist/metadata -packages dist/packages -output dist/bundle -key dist/test-bundle-signing.key -public-key-output dist/package-signing.pub -version "test-${COMMIT}" -commit "$COMMIT"
          test "$(find dist/bundle/packages -type f | wc -l)" -eq 3

      - name: Upload verified package inputs
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: verified-package-inputs
          path: |
            dist/packages
            dist/metadata
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Publish tagged Manager image
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: true

      - name: Download verified package inputs
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: verified-package-inputs
          path: dist

      - name: Sign embedded package bundle
        env:
          BUNDLE_SIGNING_KEY_B64: ${{ secrets.RELEASE_BUNDLE_SIGNING_KEY_B64 }}
          COMMIT: ${{ github.sha }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -eu
          test "$(find dist/packages -maxdepth 1 -type f -name '*.deb' | wc -l)" -eq 3
          test -n "$BUNDLE_SIGNING_KEY_B64" || { echo "RELEASE_BUNDLE_SIGNING_KEY_B64 is required for tagged releases" >&2; exit 1; }
          printf '%s' "$BUNDLE_SIGNING_KEY_B64" | base64 --decode > dist/bundle-signing.key
          go run ./cmd/mwaf-bundle -metadata dist/metadata -packages dist/packages -output dist/bundle -key dist/bundle-signing.key -public-key-output dist/package-signing.pub -version "$RELEASE_TAG" -commit "$COMMIT"
          test "$(find dist/bundle/packages -type f | wc -l)" -eq 3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ghcr.io/fhwang0926/m-waf-manager
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest
            type=sha,prefix=sha-,format=long

      - name: Build and push Manager image with verified packages
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: build/containers/manager/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
            BUNDLE_VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest published image
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661
        with:
          subject-name: ghcr.io/fhwang0926/m-waf-manager
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
