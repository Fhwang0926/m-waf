name: mwaf

services:
  mariadb:
    image: ${MARIADB_IMAGE:-mariadb:11.8.6@sha256:78a5047d3ba33975f183f183c2464cc7f1eab13ec8667e57cc9a5821d6da7577}
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"
        compress: "true"
    environment:
      MARIADB_DATABASE: ${MWAF_DB_NAME:-mwaf}
      MARIADB_USER: ${MWAF_DB_USER:-mwaf}
      MARIADB_PASSWORD_FILE: /run/secrets/mariadb_app_password
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/mariadb_root_password
      MARIADB_ROOT_HOST: localhost
    secrets:
      - mariadb_app_password
      - mariadb_root_password
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./config/mariadb.cnf:/etc/mysql/conf.d/mwaf.cnf:ro
    expose:
      - "3306"
    networks:
      - db_net
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 10

  manager:
    image: ${MWAF_MANAGER_IMAGE:-ghcr.io/fhwang0926/m-waf-manager:latest}
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"
        compress: "true"
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      MWAF_ADMIN_ADDR: ":${MWAF_ADMIN_PORT:-8443}"
      MWAF_AGENT_ADDR: ":${MWAF_AGENT_PORT:-10443}"
      MWAF_AGENT_PUBLIC_URL: "${MWAF_AGENT_PUBLIC_URL:-https://${MWAF_MANAGER_HOST:-localhost}:${MWAF_AGENT_PORT:-10443}}"
      MWAF_DB_HOST: mariadb
      MWAF_DB_PORT: "3306"
      MWAF_DB_NAME: ${MWAF_DB_NAME:-mwaf}
      MWAF_DB_USER: ${MWAF_DB_USER:-mwaf}
      MWAF_DB_PASSWORD_FILE: /run/secrets/mariadb_app_password
      MWAF_DB_MIGRATE: "true"
      MWAF_SESSION_KEY_FILE: /run/secrets/mwaf_session_key
      MWAF_TLS_CERT: /run/secrets/mwaf_tls_cert
      MWAF_TLS_KEY: /run/secrets/mwaf_tls_key
      MWAF_AGENT_CA_CERT: /run/secrets/mwaf_ca_cert
      MWAF_AGENT_CA_KEY: /run/secrets/mwaf_ca_key
      MWAF_POLICY_SIGNING_KEY: /run/secrets/mwaf_policy_signing_key
      MWAF_POLICY_SIGNING_PUBLIC: /run/secrets/mwaf_policy_signing_public
      MWAF_BUNDLE_ROOT: /opt/mwaf/bundles/current
      MWAF_BUNDLE_PUBLIC_KEY: /etc/mwaf-manager/package-signing.pub
      MWAF_BUNDLE_REQUIRED: "true"
      MWAF_ARTIFACT_ROOT: /var/lib/mwaf-manager/artifacts
      MWAF_EVENT_RETENTION: ${MWAF_EVENT_RETENTION:-720h}
      MWAF_POLICY_SYNC_INTERVAL: ${MWAF_POLICY_SYNC_INTERVAL:-15m}
    secrets:
      - mariadb_app_password
      - mwaf_session_key
      - mwaf_tls_cert
      - mwaf_tls_key
      - mwaf_ca_cert
      - mwaf_ca_key
      - mwaf_policy_signing_key
      - mwaf_policy_signing_public
    volumes:
      - mwaf_data:/var/lib/mwaf-manager
      - mwaf_logs:/var/log/mwaf-manager
    ports:
      - "${MWAF_ADMIN_BIND:-127.0.0.1}:${MWAF_ADMIN_PORT:-8443}:${MWAF_ADMIN_PORT:-8443}"
      - "${MWAF_AGENT_BIND:-0.0.0.0}:${MWAF_AGENT_PORT:-10443}:${MWAF_AGENT_PORT:-10443}"
    networks:
      - manager_net
      - db_net
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1770
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

secrets:
  mariadb_app_password:
    file: ./secrets/mariadb_app_password
  mariadb_root_password:
    file: ./secrets/mariadb_root_password
  mwaf_session_key:
    file: ./secrets/mwaf_session_key
  mwaf_tls_cert:
    file: ./secrets/mwaf_tls_cert.pem
  mwaf_tls_key:
    file: ./secrets/mwaf_tls_key.pem
  mwaf_ca_cert:
    file: ./secrets/mwaf_ca_cert.pem
  mwaf_ca_key:
    file: ./secrets/mwaf_ca_key.pem
  mwaf_policy_signing_key:
    file: ./secrets/mwaf_policy_signing_key.pem
  mwaf_policy_signing_public:
    file: ./secrets/mwaf_policy_signing_public.pem

volumes:
  mariadb_data:
  mwaf_data:
  mwaf_logs:

networks:
  manager_net:
  db_net:
    internal: true
