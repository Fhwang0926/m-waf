{{define "setup.html"}}
<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>M-WAF 최초 설정</title><link rel="stylesheet" href="/static/app.css"></head>
<body class="login-page">
  <main class="login-card setup-card">
    <div class="auth-brand">M-WAF</div>
    <p class="eyebrow">최초 설정</p>
    <h1>시스템 관리자 설정</h1>
    <p class="muted">최초 한 번만 생성할 수 있습니다. 시스템 운영 기업에 소속되며 모든 기업과 보호 서버를 관리합니다.</p>
    {{if .Error}}<div id="setup-error" class="alert error" role="alert"><strong>설정을 완료하지 못했습니다</strong><div>{{.Error}}</div></div>{{end}}
    <form method="post" action="/setup" {{if .Error}}aria-describedby="setup-error"{{end}}>
      <input type="hidden" name="csrf" value="{{.CSRF}}">
      <label>사용자명<input name="username" minlength="3" maxlength="128" pattern="[A-Za-z0-9._-]+" autocomplete="username" value="{{.Username}}" required><small>영문, 숫자, 마침표, 밑줄, 하이픈만 사용할 수 있습니다.</small></label>
      <label>표시 이름<input name="display_name" maxlength="255" autocomplete="name" value="{{.DisplayName}}" required></label>
      <label>비밀번호<input type="password" name="password" minlength="12" maxlength="256" autocomplete="new-password" required><small>12자 이상 256자 이하로 입력하세요.</small></label>
      <label>비밀번호 확인<input type="password" name="password_confirm" minlength="12" maxlength="256" autocomplete="new-password" required></label>
      <div class="form-actions"><button type="submit">시스템 관리자 생성</button></div>
    </form>
    <p class="muted">인증서 경고가 표시되면 설치 시 생성한 M-WAF CA 인증서를 브라우저 또는 운영체제 신뢰 저장소에 등록하세요.</p>
  </main>
  <script src="/static/app.js" defer></script>
</body>
</html>
{{end}}
