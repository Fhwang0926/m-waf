{{define "account.html"}}
<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>M-WAF 내 계정</title><link rel="stylesheet" href="/static/app.css"></head>
<body>{{template "navigation" .}}<main class="container narrow"><div class="page-head"><div><p class="eyebrow">계정 보안</p><h1>내 계정</h1><p class="muted">현재 로그인 계정의 비밀번호를 변경합니다.</p></div></div>
{{if .Error}}<div id="account-error" class="alert error" role="alert"><strong>비밀번호를 변경하지 못했습니다</strong><div>{{.Error}}</div></div>{{end}}
<section class="panel"><h2>비밀번호 변경</h2><p class="muted">변경이 완료되면 현재 세션을 종료하고 다시 로그인합니다.</p><form method="post" action="/account/password" {{if .Error}}aria-describedby="account-error"{{end}}><input type="hidden" name="csrf" value="{{.CSRF}}"><label>현재 비밀번호<input type="password" name="current_password" autocomplete="current-password" required></label><label>새 비밀번호<input type="password" name="password" minlength="12" maxlength="256" autocomplete="new-password" required><small>12자 이상 256자 이하로 입력하세요.</small></label><label>새 비밀번호 확인<input type="password" name="password_confirm" minlength="12" maxlength="256" autocomplete="new-password" required></label><div class="form-actions"><button type="submit">비밀번호 변경</button></div></form></section>
</main></body></html>
{{end}}
