{{define "login.html"}}
<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>M-WAF 로그인</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body class="login-page">
  <main class="login-card">
    <div class="auth-brand">M-WAF</div>
    <p class="eyebrow">관리자 콘솔</p>
    <h1>관리자 로그인</h1>
    <p class="muted">정책, 보호 서버와 WAF 이벤트를 중앙에서 관리합니다.</p>
    {{if .PasswordChanged}}<div class="alert success" role="status"><strong>비밀번호 변경 완료</strong><div>새 비밀번호로 로그인하세요.</div></div>{{end}}
    {{if .Error}}<div id="login-error" class="alert error" role="alert"><strong>로그인 실패</strong><div>{{.Error}}</div></div>{{end}}
    <form method="post" action="/login" {{if .Error}}aria-describedby="login-error"{{end}}>
      <label>사용자명<input name="username" autocomplete="username" value="{{.Username}}" required></label>
      <label>비밀번호<input type="password" name="password" autocomplete="current-password" required></label>
      <div class="form-actions"><button type="submit">로그인</button></div>
    </form>
  </main>
  <script src="/static/app.js" defer></script>
</body>
</html>
{{end}}
